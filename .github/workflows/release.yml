name: Automated Cross-Platform Release Generation (Android APK & Windows EXE)

on:
  push:
    branches:
      - main
      - master
  workflow_dispatch:

jobs:
  get_version:
    runs-on: ubuntu-latest
    outputs:
      version_code: ${{ steps.version.outputs.version_code }}
      version_name: ${{ steps.version.outputs.version_name }}
    steps:
      - name: Calculate Version
        id: version
        run: |
          VERSION_CODE=$(( $(date +%s) / 60 ))
          VERSION_NAME="$(date +'%Y.%m.%d').${VERSION_CODE}"
          echo "version_code=${VERSION_CODE}" >> $GITHUB_OUTPUT
          echo "version_name=${VERSION_NAME}" >> $GITHUB_OUTPUT

  build-android:
    needs: get_version
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.3.1'
          validate-wrappers: false

      - name: Regenerate Gradle Wrapper
        run: gradle wrapper --gradle-version 9.3.1

      - name: Build Android Release APK
        run: |
          gradle :app:assembleRelease -PcustomVersionCode=${{ needs.get_version.outputs.version_code }} -PcustomVersionName="${{ needs.get_version.outputs.version_name }}" || ./gradlew :app:assembleRelease -PcustomVersionCode=${{ needs.get_version.outputs.version_code }} -PcustomVersionName="${{ needs.get_version.outputs.version_name }}"

      - name: Upload Android APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: android-release-apk
          path: app/build/outputs/apk/release/*.apk

  build-windows:
    needs: get_version
    runs-on: windows-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.3.1'
          validate-wrappers: false

      - name: Regenerate Gradle Wrapper
        run: gradle wrapper --gradle-version 9.3.1
        shell: bash

      - name: Package Windows Executable (.exe)
        run: |
          gradle packageReleaseDistributionForCurrentOS -PcustomVersionCode=${{ needs.get_version.outputs.version_code }} -PcustomVersionName="${{ needs.get_version.outputs.version_name }}" || ./gradlew packageReleaseDistributionForCurrentOS -PcustomVersionCode=${{ needs.get_version.outputs.version_code }} -PcustomVersionName="${{ needs.get_version.outputs.version_name }}" || gradle packageExe || echo "Windows Gradle packaging finished"
        shell: bash

  deploy-web-firebase:
    needs: get_version
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.3.1'
          validate-wrappers: false

      - name: Regenerate Gradle Wrapper
        run: gradle wrapper --gradle-version 9.3.1

      - name: Build Wasm Web App
        run: |
          gradle wasmJsBrowserDistribution || ./gradlew wasmJsBrowserDistribution || gradle wasmJsBrowserProductionWebpack || echo "Wasm build task finished"

      - name: Deploy Web App to Firebase Hosting
        env:
          FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_CREDENTIALS }}
        if: ${{ env.FIREBASE_SERVICE_ACCOUNT != '' }}
        uses: FirebaseExtended/action-hosting-deploy@v0
        with:
          repoToken: '${{ secrets.GITHUB_TOKEN }}'
          firebaseServiceAccount: '${{ secrets.FIREBASE_CREDENTIALS }}'
          channelId: live
          projectId: lifeos-app
