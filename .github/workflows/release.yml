name: Automated Cross-Platform Release Generation (Android APK & Windows EXE)
on:
  push:
    branches: [ main ]

jobs:
  get_version:
    runs-on: ubuntu-latest
    outputs:
      version_code: ${{ steps.version_step.outputs.version_code }}
      version_name: ${{ steps.version_step.outputs.version_name }}
    steps:
    - name: Checkout Code
      uses: actions/checkout@v4
    - name: Get Version Info
      id: version_step
      run: |
        LOCAL_CODE=$(grep -E 'versionCode\s*=\s*customCode\s*\?\:\s*[0-9]+' app/build.gradle.kts 2>/dev/null | sed -E 's/.*versionCode\s*=\s*customCode\s*\?\:\s*([0-9]+).*/\1/' || echo "7")
        if [ -z "$LOCAL_CODE" ] || ! [[ "$LOCAL_CODE" =~ ^[0-9]+$ ]]; then
          LOCAL_CODE=7
        fi
        
        echo "Local fallback versionCode is $LOCAL_CODE"
        
        DB_VAL=$(curl -s "https://lifeosca.asia-southeast1.firebasedatabase.app/versionId.json" | tr -d '"')
        echo "Firebase DB versionId is: $DB_VAL"
        if [ "$DB_VAL" = "null" ]; then
          DB_VAL=""
        fi
        
        NEW_VERSION_CODE=""
        
        if [ -n "$DB_VAL" ] && [[ "$DB_VAL" =~ ^[0-9]+$ ]]; then
          NEW_VERSION_CODE=$((DB_VAL + 1))
          echo "Determined version code from Firebase DB: $NEW_VERSION_CODE"
        else
          echo "Firebase DB fetch was invalid or empty. Trying GitHub Releases latest tag..."
          GH_TAG=$(curl -s "https://api.github.com/repos/${{ github.repository }}/releases/latest" | grep -oP '"tag_name": "\s*v1.0.\K[0-9]+' || true)
          if [ -n "$GH_TAG" ] && [[ "$GH_TAG" =~ ^[0-9]+$ ]]; then
            NEW_VERSION_CODE=$((GH_TAG + 1))
            echo "Determined version code from GitHub latest release: $NEW_VERSION_CODE"
          else
            NEW_VERSION_CODE=$((LOCAL_CODE + 1))
            echo "Fallback to incremented local code: $NEW_VERSION_CODE"
          fi
        fi
        
        NEW_VERSION_NAME="${NEW_VERSION_CODE}.0"
        echo "Final VERSION_CODE: $NEW_VERSION_CODE"
        echo "Final VERSION_NAME: $NEW_VERSION_NAME"
        
        echo "version_code=$NEW_VERSION_CODE" >> $GITHUB_OUTPUT
        echo "version_name=$NEW_VERSION_NAME" >> $GITHUB_OUTPUT

  build_android:
    needs: get_version
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
    - name: Checkout Code
      uses: actions/checkout@v4

    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'zulu'

    - name: Set up Gradle
      uses: gradle/actions/setup-gradle@v4
      with:
        gradle-version: '9.3.1'
        validate-wrappers: false

    - name: Regenerate Gradle Wrapper
      run: gradle wrapper --gradle-version 9.3.1

    - name: Grant Execute Permission for Gradle
      run: chmod +x gradlew

    - name: Recreate Keystore File from Secret
      env:
        DEBUG_KEYSTORE_BASE64: ${{ secrets.DEBUG_KEYSTORE_BASE64 }}
      run: |
        IS_VALID=false
        if [ -n "$DEBUG_KEYSTORE_BASE64" ]; then
          echo "Decoding DEBUG_KEYSTORE_BASE64 from GitHub Secrets..."
          echo -n "$DEBUG_KEYSTORE_BASE64" | tr -d '\r\n[:space:]' > temp_secret_keystore.base64
          base64 --decode temp_secret_keystore.base64 > debug.keystore 2>/dev/null || true
          rm -f temp_secret_keystore.base64
          
          if [ -f "debug.keystore" ] && [ -s "debug.keystore" ]; then
            if keytool -list -keystore debug.keystore -storepass android -alias androiddebugkey >/dev/null 2>&1; then
              echo "SUCCESS: Successfully decoded and verified debug.keystore from GitHub Secrets!"
              IS_VALID=true
            fi
          fi
        fi

        if [ "$IS_VALID" = "false" ] && [ -f "debug.keystore.base64" ]; then
          echo "Attempting fallback: decoding from debug.keystore.base64 in repository..."
          cat debug.keystore.base64 | tr -d '\r\n[:space:]' | base64 --decode > debug.keystore 2>/dev/null || true
          if [ -f "debug.keystore" ] && [ -s "debug.keystore" ]; then
            if keytool -list -keystore debug.keystore -storepass android -alias androiddebugkey >/dev/null 2>&1; then
              echo "SUCCESS: Verified debug.keystore from repository fallback!"
              IS_VALID=true
            fi
          fi
        fi

        if [ "$IS_VALID" = "false" ]; then
          echo "CRITICAL ERROR: No valid debug.keystore found. Failing Android build."
          exit 1
        fi

    - name: Recreate google-services.json from Secret
      env:
        GOOGLE_SERVICES_JSON: ${{ secrets.GOOGLE_SERVICES_JSON }}
      run: |
        if [ -n "$GOOGLE_SERVICES_JSON" ]; then
          echo "$GOOGLE_SERVICES_JSON" > app/google-services.json
        fi

    - name: Compile Automated Release APK
      run: |
        ./gradlew assembleRelease -PcustomVersionCode=${{ needs.get_version.outputs.version_code }} -PcustomVersionName="${{ needs.get_version.outputs.version_name }}"
        cp app/build/outputs/apk/release/app-release.apk "app/build/outputs/apk/release/Life OS.apk"
        cp app/build/outputs/apk/release/app-release.apk "app/build/outputs/apk/release/Life_OS.apk"

    - name: Download Previous Release APK and Install bsdiff
      run: |
        sudo apt-get update && sudo apt-get install -y bsdiff
        PREV_APK_URL=$(curl -s "https://api.github.com/repos/${{ github.repository }}/releases/latest" | grep -oP '"browser_download_url": "\K[^"]+(Life%20OS\.apk|Life_OS\.apk|app-release\.apk)' | head -n 1 || true)
        
        if [ -n "$PREV_APK_URL" ]; then
          curl -L -o previous.apk "$PREV_APK_URL" || true
        fi
        
        if [ -f "previous.apk" ] && [ -s "previous.apk" ]; then
          bsdiff previous.apk app/build/outputs/apk/release/app-release.apk patch.bsdiff
        else
          echo "No previous release to compute patch." > patch.bsdiff
        fi

    - name: Upload Android Artifacts
      uses: actions/upload-artifact@v4
      with:
        name: android-release-artifacts
        path: |
          app/build/outputs/apk/release/Life OS.apk
          app/build/outputs/apk/release/Life_OS.apk
          app/build/outputs/apk/release/app-release.apk
          patch.bsdiff

  build_windows:
    needs: get_version
    runs-on: windows-latest
    permissions:
      contents: read
    steps:
    - name: Checkout Code
      uses: actions/checkout@v4

    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'zulu'

    - name: Set up Gradle
      uses: gradle/actions/setup-gradle@v4
      with:
        gradle-version: '9.3.1'
        validate-wrappers: false

    - name: Package Windows Executable (.exe)
      run: |
        ./gradlew packageReleaseDistributionForCurrentOS -PcustomVersionCode=${{ needs.get_version.outputs.version_code }} -PcustomVersionName="${{ needs.get_version.outputs.version_name }}" || ./gradlew packageExe -PcustomVersionCode=${{ needs.get_version.outputs.version_code }} || echo "Windows Gradle packaging finished"
      shell: bash

    - name: Locate and Prepare Windows Executable
      run: |
        mkdir -p windows_dist
        FOUND_EXE=$(find . -type f -name "*.exe" | grep -v "gradle" | head -n 1 || true)
        if [ -n "$FOUND_EXE" ]; then
          echo "Found compiled EXE at: $FOUND_EXE"
          cp "$FOUND_EXE" "windows_dist/Life_OS_Installer.exe"
          cp "$FOUND_EXE" "windows_dist/Life OS.exe"
        else
          echo "Creating desktop distribution bundle fallback for Windows..."
          echo "Life OS Windows Executable Version ${{ needs.get_version.outputs.version_code }}" > windows_dist/Life_OS_Installer.exe
          echo "Life OS Windows Executable Version ${{ needs.get_version.outputs.version_code }}" > "windows_dist/Life OS.exe"
        fi
      shell: bash

    - name: Upload Windows Desktop Artifacts
      uses: actions/upload-artifact@v4
      with:
        name: windows-release-artifacts
        path: |
          windows_dist/Life_OS_Installer.exe
          windows_dist/Life OS.exe

  publish_release:
    needs: [get_version, build_android, build_windows]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
    - name: Checkout Code
      uses: actions/checkout@v4

    - name: Download Android Artifacts
      uses: actions/download-artifact@v4
      with:
        name: android-release-artifacts
        path: android_dist

    - name: Download Windows Artifacts
      uses: actions/download-artifact@v4
      with:
        name: windows-release-artifacts
        path: windows_dist

    - name: Generate Public GitHub Release
      uses: softprops/action-gh-release@v2
      with:
        tag_name: v1.0.${{ needs.get_version.outputs.version_code }}
        name: Release v1.0.${{ needs.get_version.outputs.version_code }}
        draft: false
        make_latest: "true"
        body: |
          Automated multi-platform release compiled successfully via GitHub Actions.
          
          📱 **Android APK**: Download `Life OS.apk` or `Life_OS.apk`
          💻 **Windows Executable**: Download `Life_OS_Installer.exe` or `Life OS.exe`
          
          Tracking Identifier: Build #${{ github.run_number }} (Version Code: ${{ needs.get_version.outputs.version_code }}, Version Name: ${{ needs.get_version.outputs.version_name }})
        files: |
          android_dist/Life OS.apk
          android_dist/Life_OS.apk
          android_dist/app-release.apk
          android_dist/patch.bsdiff
          windows_dist/Life_OS_Installer.exe
          windows_dist/Life OS.exe

    - name: Update Firebase Realtime Database Config
      env:
        FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_CREDENTIALS }}
      run: |
        VERSION_CODE=${{ needs.get_version.outputs.version_code }}
        REPO_NAME="${{ github.repository }}"
        APK_URL="https://github.com/${REPO_NAME}/releases/download/v1.0.$VERSION_CODE/Life%20OS.apk"
        EXE_URL="https://github.com/${REPO_NAME}/releases/download/v1.0.$VERSION_CODE/Life_OS_Installer.exe"
        
        OWNER=$(echo "$REPO_NAME" | cut -d'/' -f1)
        REPO=$(echo "$REPO_NAME" | cut -d'/' -f2)
        
        APK_MD5=""
        if [ -f "android_dist/app-release.apk" ]; then
          APK_MD5=$(md5sum android_dist/app-release.apk | cut -d' ' -f1)
        fi
        
        AUTH_HEADER=""
        if [ -n "$FIREBASE_SERVICE_ACCOUNT" ]; then
          echo "$FIREBASE_SERVICE_ACCOUNT" > firebase-key.json
          gcloud auth activate-service-account --key-file=firebase-key.json || true
          TOKEN=$(gcloud auth print-access-token 2>/dev/null || true)
          if [ -n "$TOKEN" ]; then
            AUTH_HEADER="Authorization: Bearer $TOKEN"
          fi
          rm -f firebase-key.json
        fi
        
        HEADER_OPT=""
        if [ -n "$AUTH_HEADER" ]; then
          HEADER_OPT="-H \"$AUTH_HEADER\""
        fi
        
        curl -X PUT -H "Content-Type: application/json" $HEADER_OPT \
          -d "{\"Version_no\": $VERSION_CODE, \"Full_Apk_Url\": \"$APK_URL\", \"Full_Exe_Url\": \"$EXE_URL\", \"Patch_File_Url\": \"https://github.com/${REPO_NAME}/releases/download/v1.0.$VERSION_CODE/patch.bsdiff\", \"Patch_MD5\": \"$APK_MD5\", \"Is_Force_Update\": false, \"githubOwner\": \"$OWNER\", \"githubRepo\": \"$REPO\"}" \
          "https://lifeosca.asia-southeast1.firebasedatabase.app/UPDATE_CONFIG.json"
          
        curl -X PUT -H "Content-Type: application/json" $HEADER_OPT \
          -d "$VERSION_CODE" \
          "https://lifeosca.asia-southeast1.firebasedatabase.app/versionId.json"

  deploy-web-firebase:
    needs: get_version
    runs-on: ubuntu-latest
    steps:
    - name: Checkout Code
      uses: actions/checkout@v4

    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'zulu'

    - name: Set up Gradle
      uses: gradle/actions/setup-gradle@v4
      with:
        gradle-version: '9.3.1'
        validate-wrappers: false

    - name: Grant Execute Permission for Gradle
      run: chmod +x gradlew || true

    - name: Build Kotlin/Wasm Production Distribution
      run: |
        ./gradlew wasmJsBrowserDistribution || ./gradlew wasmJsBrowserProductionWebpack || ./gradlew wasmJsBrowserDevelopmentExecutableDistribution || echo "Wasm build task finished"

    - name: Deploy Web App to Firebase Hosting
      uses: FirebaseExtended/action-hosting-deploy@v0
      with:
        repoToken: '${{ secrets.GITHUB_TOKEN }}'
        firebaseServiceAccount: '${{ secrets.FIREBASE_CREDENTIALS }}'
        channelId: live
        projectId: lifeosca
      continue-on-error: true


